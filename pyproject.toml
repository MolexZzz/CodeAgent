[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memcodeagent"
version = "0.1.0"
description = "CodeAgent: a lightweight CLI coding agent with local memory and code retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "MolexZzz" }
]
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "numpy>=1.24.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.2.0",
  "prompt-toolkit>=3.0.0",
  "questionary>=2.0.0",
  "tree-sitter>=0.21.0",
  "tree-sitter-java>=0.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
mca = "memcodeagent.cli:app"
memcodeagent = "memcodeagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
